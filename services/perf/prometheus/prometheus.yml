global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'synorix'
    environment: 'testing'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Security Proxy Metrics
  - job_name: 'security-proxy'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'security-proxy'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Backend API Metrics
  - job_name: 'backend-api'
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels:
          service: 'backend'
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # AI Compression Service
  - job_name: 'ai-compression'
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          service: 'ai-compression'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Suricata Metrics (if exposed)
  - job_name: 'suricata'
    static_configs:
      - targets: ['host.docker.internal:9200']
        labels:
          service: 'suricata-ids'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node Exporter for system metrics (optional)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'
